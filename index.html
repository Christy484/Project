<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101323">
  <meta name="description" content="A little hello to brighten your day.">
  <title>Hello, World!</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #101323;
      color: #f8f7ff;
      font-synthesis: none;
      text-rendering: optimizeLegibility;
      -webkit-font-smoothing: antialiased;
    }

    * { box-sizing: border-box; }

    .site-nav {
      position: fixed;
      z-index: 1;
      top: 1.5rem;
      left: 50%;
      display: flex;
      gap: .35rem;
      padding: .4rem;
      transform: translateX(-50%);
      border: 1px solid #ffffff1c;
      border-radius: 999px;
      background: #ffffff0b;
      backdrop-filter: blur(14px);
    }

    .site-nav a {
      padding: .65rem 1rem;
      border-radius: 999px;
      color: #c4c4d5;
      font-size: .88rem;
      text-decoration: none;
      transition: color 180ms ease, background 180ms ease;
    }
    .site-nav a:hover, .site-nav a[aria-current="page"] { color: #fff; background: #ffffff16; }

    body {
      min-height: 100svh;
      margin: 0;
      display: grid;
      place-items: center;
      overflow: hidden;
      background:
        radial-gradient(ellipse at 18% 15%, #8b5cf633 0, transparent 34%),
        radial-gradient(ellipse at 84% 82%, #20d6c533 0, transparent 32%),
        linear-gradient(145deg, #101323, #171a31 58%, #101323);
    }

    body::before, body::after {
      content: "";
      position: fixed;
      width: 28rem;
      aspect-ratio: 1;
      border: 1px solid #ffffff0b;
      border-radius: 50%;
      pointer-events: none;
    }
    body::before { top: -17rem; right: -7rem; box-shadow: 0 0 0 3rem #ffffff05, 0 0 0 6rem #ffffff03; }
    body::after { bottom: -21rem; left: -10rem; width: 36rem; box-shadow: 0 0 0 3rem #ffffff04, 0 0 0 6rem #ffffff02; }

    main {
      position: relative;
      width: min(90vw, 760px);
      padding: clamp(2.25rem, 7vw, 5.5rem) clamp(1.5rem, 8vw, 6rem);
      text-align: center;
      border: 1px solid #ffffff20;
      border-radius: 32px;
      background: linear-gradient(145deg, #ffffff12, #ffffff05);
      box-shadow: 0 32px 100px #00000050, inset 0 1px #ffffff20;
      backdrop-filter: blur(18px);
      animation: arrive 900ms cubic-bezier(.2,.8,.2,1) both;
    }

    .sparkle {
      display: grid;
      width: 64px;
      height: 64px;
      margin: 0 auto 2rem;
      place-items: center;
      border: 1px solid #ffffff24;
      border-radius: 21px;
      background: linear-gradient(145deg, #a78bfa33, #34d8c333);
      box-shadow: 0 10px 35px #8b5cf633;
      font-size: 1.8rem;
      animation: float 4s ease-in-out infinite;
    }

    .eyebrow {
      margin: 0 0 1rem;
      color: #b9b5d5;
      font-size: .76rem;
      font-weight: 700;
      letter-spacing: .24em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-size: clamp(3.5rem, 11vw, 7rem);
      font-weight: 800;
      letter-spacing: -.075em;
      line-height: .98;
    }

    h1 span {
      color: transparent;
      background: linear-gradient(100deg, #c4b5fd 10%, #72eee0 88%);
      background-clip: text;
      -webkit-background-clip: text;
    }

    .message {
      max-width: 420px;
      margin: 1.5rem auto 0;
      color: #c4c4d5;
      font-size: clamp(1rem, 2.5vw, 1.16rem);
      line-height: 1.75;
    }

    .rule {
      width: 54px;
      height: 3px;
      margin: 2rem auto 1.2rem;
      border-radius: 99px;
      background: linear-gradient(90deg, #a78bfa, #56e0d2);
    }

    footer { color: #8889a4; font-size: .82rem; letter-spacing: .04em; }

    @keyframes arrive {
      from { opacity: 0; transform: translateY(18px) scale(.985); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }
    @keyframes float { 50% { transform: translateY(-5px) rotate(3deg); } }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; scroll-behavior: auto !important; }
    }
  </style>
</head>
<body>
  <nav class="site-nav" aria-label="Main navigation">
    <a href="index.html" aria-current="page">Home</a>
    <a href="about.html">About</a>
    <a href="contact.html">Contact</a>
  </nav>
  <main>
    <div class="sparkle" aria-hidden="true">✦</div>
    <p class="eyebrow">A tiny beginning</p>
    <h1>Hello,<br><span>world!</span></h1>
    <p class="message">A little page, a little color, and one big hello. Here’s to whatever comes next.</p>
    <div class="rule" aria-hidden="true"></div>
    <footer>Made with a little ✨</footer>
  </main>
</body>
</html>
